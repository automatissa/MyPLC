; ============================================================================
;  MyPLC Firmware — ESP32 Remote I/O Board  (Cas n°2)
;
;  L'ESP32 est une carte I/O distante dumb :
;    - Lit les capteurs (GPIO / ADC) et les expose en Modbus holding registers
;    - Reçoit les valeurs de sortie de la RPi et pilote les actionneurs
;    - Aucune logique PLC sur l'ESP32 — c'est la RPi qui fait tourner le PLC
;
;  Seul fichier à éditer : src/io_map.h
;    → déclarer quels GPIO correspondent à quels registres Modbus
;
;  Upload : pio run -t upload
;  Monitor: pio device monitor
; ============================================================================

[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino

monitor_speed = 115200

build_flags =
    -std=gnu++17
